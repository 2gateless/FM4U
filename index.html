<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#130826" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FM Radio" />
<title>FM Radio</title>

<!-- App Icons & Manifest -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root {
    --bg-gradient: linear-gradient(180deg, #1d0f36 0%, #0f061f 100%);
    --card-bg: rgba(43, 24, 75, 0.45);
    --card-border: rgba(147, 95, 230, 0.18);
    --card-active-bg: rgba(79, 38, 140, 0.65);
    --card-active-border: #a855f7;
    --text-primary: #f3effe;
    --text-secondary: #a797c4;
    --accent-glow: rgba(168, 85, 247, 0.45);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: #0d061b;
    background-image: radial-gradient(circle at 50% 10%, #2e1065 0%, #0d061b 80%);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    padding: 12px 14px;
  }

  .app-container {
    width: 100%;
    max-width: 460px;
    background: var(--bg-gradient);
    border-radius: 32px;
    padding: 22px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(147, 51, 234, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Header */
  .header-title {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  /* Player Hero Section */
  .hero-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    margin: 4px 0;
  }

  .visualizer-bg {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 240px;
    height: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    z-index: 1;
    pointer-events: none;
    opacity: 0.65;
  }

  .v-bar {
    width: 4px;
    background: linear-gradient(180deg, #ec4899 0%, #a855f7 100%);
    border-radius: 4px;
    height: 20%;
    transition: height 0.2s ease;
  }

  .playing .v-bar {
    animation: soundWave 1.2s ease-in-out infinite alternate;
  }

  .v-bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
  .v-bar:nth-child(2) { animation-delay: 0.3s; height: 55%; }
  .v-bar:nth-child(3) { animation-delay: 0.5s; height: 80%; }
  .v-bar:nth-child(4) { animation-delay: 0.2s; height: 40%; }
  .v-bar:nth-child(5) { animation-delay: 0.6s; height: 95%; }
  .v-bar:nth-child(6) { animation-delay: 0.4s; height: 60%; }
  .v-bar:nth-child(7) { animation-delay: 0.7s; height: 75%; }
  .v-bar:nth-child(8) { animation-delay: 0.25s; height: 35%; }
  .v-bar:nth-child(9) { animation-delay: 0.45s; height: 85%; }

  @keyframes soundWave {
    0% { height: 15%; }
    50% { height: 95%; }
    100% { height: 30%; }
  }

  .headphone-avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #6b21a8 0%, #3b0764 100%);
    border: 3px solid rgba(168, 85, 247, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .playing .headphone-avatar {
    transform: scale(1.04);
    border-color: #a855f7;
    box-shadow: 0 0 26px var(--accent-glow), 0 8px 20px rgba(0, 0, 0, 0.5);
  }

  .headphone-avatar svg {
    width: 44px;
    height: 44px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .current-meta {
    margin-top: 8px;
    text-align: center;
    z-index: 2;
  }

  .current-meta .channel-title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .current-meta .channel-sub {
    font-size: 13.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* Master Controls */
  .master-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 2px 0;
    z-index: 2;
  }

  .play-main-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
    border: 2px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(168, 85, 247, 0.45);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .play-main-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 24px rgba(168, 85, 247, 0.6);
  }

  .play-main-btn:active {
    transform: scale(0.95);
  }

  .stop-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    padding: 8px;
  }

  .stop-btn:hover {
    color: #f43f5e;
    transform: scale(1.1);
  }

  /* Station Cards Container */
  .station-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .station-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(10px);
  }

  .station-card:hover {
    background: rgba(57, 32, 99, 0.55);
    border-color: rgba(168, 85, 247, 0.35);
  }

  .station-card.active {
    background: var(--card-active-bg);
    border-color: var(--card-active-border);
    box-shadow: 0 6px 18px rgba(147, 51, 234, 0.25);
  }

  .badge-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    flex-shrink: 0;
    color: #ffffff;
    background: rgba(147, 51, 234, 0.25);
    border: 1px solid rgba(168, 85, 247, 0.3);
  }

  .station-card.active .badge-icon {
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
    border-color: transparent;
  }

  .station-info {
    flex: 1;
    min-width: 0;
  }

  .station-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .station-desc {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .play-indicator {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }

  .station-card.active .play-indicator {
    color: #a855f7;
  }

  /* Status Bar at Bottom */
  .status-bar {
    padding: 10px 14px;
    background: rgba(23, 12, 42, 0.7);
    border-radius: 12px;
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a855f7;
  }

  .status-bar.error .status-dot {
    background: #ef4444;
  }

  .status-bar.error {
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.2);
  }

  /* Footer */
  .app-footer {
    text-align: center;
    font-size: 11.5px;
    color: rgba(167, 151, 196, 0.4);
    letter-spacing: 0.02em;
    padding-top: 2px;
    margin-top: 0;
  }
</style>
</style>
</head>
<body>

<div class="app-container">
  <!-- Top Header -->
  <div class="header-title">RADIO PLAYER</div>

  <!-- Hero Player Area -->
  <div class="hero-player" id="heroPlayer">
    <div class="visualizer-bg">
      <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
      <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
      <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
    </div>
    <div class="headphone-avatar">
      <svg viewBox="0 0 24 24">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"></path>
        <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
    </div>
    <div class="current-meta">
      <div class="channel-title" id="currentTitle">FM RADIO</div>
      <div class="channel-sub" id="currentSub">채널을 선택하세요</div>
    </div>
  </div>

  <!-- Master Controls -->
  <div class="master-controls">
    <button class="play-main-btn" id="masterPlayBtn" title="재생 / 일시정지">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </button>
    <button class="stop-btn" id="stopCurrentBtn" title="정지">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><rect x="9" y="9" width="6" height="6" fill="currentColor"></rect></svg>
    </button>
  </div>

  <!-- Station List (Only KBS, MBC, CBS) -->
  <div class="station-list">
    <!-- KBS 1FM -->
    <div class="station-card" data-ch="kbs1fm" data-name="KBS 1FM" data-desc="클래식 · 음악 전문 (93.1MHz)">
      <div class="badge-icon">KBS</div>
      <div class="station-info">
        <div class="station-name">KBS 1FM</div>
        <div class="station-desc">클래식 · 음악 전문 (93.1MHz)</div>
      </div>
      <div class="play-indicator">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- MBC FM4U -->
    <div class="station-card" data-ch="mbc4u" data-name="MBC FM4U" data-desc="가요 · 팝 음악 (91.9MHz)">
      <div class="badge-icon">MBC</div>
      <div class="station-info">
        <div class="station-name">MBC FM4U</div>
        <div class="station-desc">가요 · 팝 음악 (91.9MHz)</div>
      </div>
      <div class="play-indicator">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- CBS 음악FM -->
    <div class="station-card" data-ch="cbsmusic" data-name="CBS 음악FM" data-desc="음악 전문 레인보우 (93.9MHz)">
      <div class="badge-icon">CBS</div>
      <div class="station-info">
        <div class="station-name">CBS 음악FM</div>
        <div class="station-desc">음악 전문 레인보우 (93.9MHz)</div>
      </div>
      <div class="play-indicator">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" fill="currentColor"/></svg>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">채널을 눌러 재생하세요</span>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    FM4U, Antigravity 2026.8.30. V1.1
  </footer>
</div>

<audio id="player"></audio>

<script>
  const audio = document.getElementById('player');
  const statusBar = document.getElementById('statusBar');
  const statusText = document.getElementById('statusText');
  const heroPlayer = document.getElementById('heroPlayer');
  const currentTitle = document.getElementById('currentTitle');
  const currentSub = document.getElementById('currentSub');
  const masterPlayBtn = document.getElementById('masterPlayBtn');
  const stopCurrentBtn = document.getElementById('stopCurrentBtn');
  const stationCards = Array.from(document.querySelectorAll('.station-card'));

  let hls = null;
  let currentCh = null;
  let currentChName = '';
  let requestToken = 0; // 채널을 빠르게 연속으로 눌러도 마지막 요청만 반영되도록 하는 순번표

  function setStatus(text, isError = false){
    statusText.textContent = text;
    statusBar.classList.toggle('error', isError);
  }

  function renderState(isPlaying){
    heroPlayer.classList.toggle('playing', isPlaying);
    stationCards.forEach(card => {
      const isThis = card.dataset.ch === currentCh;
      card.classList.toggle('active', isThis && isPlaying);
    });

    if(isPlaying){
      masterPlayBtn.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
    } else {
      masterPlayBtn.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
    }
  }

  function stopPlayback(){
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    if(hls){
      hls.destroy();
      hls = null;
    }
    renderState(false);
  }

  async function playChannel(ch, name, desc){
    if(currentCh === ch && !audio.paused){
      stopPlayback();
      currentCh = null;
      currentTitle.textContent = 'FM RADIO';
      currentSub.textContent = '채널을 선택하세요';
      setStatus('재생이 정지되었습니다');
      return;
    }

    // 이 호출만의 고유 번호를 발급합니다. 재생 도중 다른 채널을 또 누르면
    // requestToken이 바뀌므로, 뒤늦게 도착한 이전 요청 결과는 무시됩니다.
    const myToken = ++requestToken;

    stopPlayback();
    currentCh = ch;
    currentChName = name;
    currentTitle.textContent = name;
    currentSub.textContent = desc;

    setStatus(name + ' 연결 중...');

    try{
      const res = await fetch('streams.json?t=' + Date.now(), { cache: 'no-store' });
      if(myToken !== requestToken) return; // 그 사이 다른 채널을 눌렀으면 여기서 중단

      if(!res.ok){
        throw new Error('streams.json을 불러오지 못했습니다 (' + res.status + ')');
      }
      const data = await res.json();
      const streamUrl = data[ch];

      if(!streamUrl){
        throw new Error('방송 스트림 주소를 가져오지 못했습니다. 잠시 후 다시 시도해주세요.');
      }

      if(streamUrl.includes('.m3u8') && window.Hls && Hls.isSupported()){
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);
        hls.on(Hls.Events.ERROR, (event, d) => {
          if(myToken !== requestToken) return;
          if(d.fatal){
            setStatus('스트림 연결 중 오류 발생', true);
            renderState(false);
          }
        });
      } else {
        audio.src = streamUrl;
      }

      await audio.play();
      if(myToken !== requestToken) return; // 재생 시작 직전에 채널이 또 바뀌었을 경우 대비

      renderState(true);
      setStatus('LIVE · ' + name + ' 방송 재생 중');
    } catch(err){
      if(myToken !== requestToken) return; // 이미 낡은 요청이면 에러도 무시
      console.error(err);
      renderState(false);
      setStatus('연결 실패: ' + (err && err.message ? err.message : err), true);
      currentCh = null;
    }
  }

  // Event Listeners
  stationCards.forEach(card => {
    card.addEventListener('click', () => {
      const ch = card.dataset.ch;
      const name = card.dataset.name;
      const desc = card.dataset.desc;
      playChannel(ch, name, desc);
    });
  });

  masterPlayBtn.addEventListener('click', () => {
    if(!currentCh){
      const firstCard = stationCards[0];
      playChannel(firstCard.dataset.ch, firstCard.dataset.name, firstCard.dataset.desc);
    } else if(audio.paused){
      audio.play().then(() => renderState(true)).catch(console.error);
    } else {
      audio.pause();
      renderState(false);
      setStatus('일시 정지됨 — ' + currentChName);
    }
  });

  stopCurrentBtn.addEventListener('click', () => {
    stopPlayback();
    currentCh = null;
    currentTitle.textContent = 'FM RADIO';
    currentSub.textContent = '채널을 선택하세요';
    setStatus('재생 정지됨');
  });

  audio.addEventListener('waiting', () => {
    if(currentCh) setStatus('버퍼링 중...');
  });

  audio.addEventListener('playing', () => {
    if(currentCh){
      renderState(true);
      setStatus('LIVE · ' + currentChName + ' 방송 재생 중');
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.log('SW registration failed: ', err);
      });
    });
  }
</script>
</body>
</html>
